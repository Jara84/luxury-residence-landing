<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>El Cerro Boutique Residence | Luxury Apartment in Medellín</title>

    <meta
      name="description"
      content="Discover El Cerro Boutique Residence, a fully renovated luxury apartment in Medellín with premium finishes, panoramic city views and an exceptional location next to Cerro Nutibara."
    />

    <meta
      name="keywords"
      content="Luxury apartment Medellín, Boutique Residence Medellín, El Cerro Residence, Luxury Real Estate Colombia, Apartment for Sale Medellín"
    />

    <meta name="author" content="Daniel Jaramillo" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#1c1917" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://elcerroresidence.com"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="El Cerro Boutique Residence"
    />

    <meta
      property="og:description"
      content="Luxury apartment in Medellín with premium finishes, three balconies and panoramic views."
    />

    <meta
      property="og:image"
      content="/og-cover.jpg"
    />

    <meta
      property="og:url"
      content="https://elcerroresidence.com"
    />

    <meta
      property="og:site_name"
      content="El Cerro Boutique Residence"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="El Cerro Boutique Residence"
    />

    <meta
      name="twitter:description"
      content="Luxury apartment in Medellín with premium finishes and exceptional design."
    />

    <meta
      name="twitter:image"
      content="/og-cover.jpg"
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <link
      rel="manifest"
      href="/site.webmanifest"
    />
  </head>

  <body>
    <div id="root"></div>

    <script

      src="/src/main.tsx"
    ></script>
