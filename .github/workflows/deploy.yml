name: Deploy to AWS

on:
  push:
    branches:
      - feature/internationalization

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Configurar en GitHub > Settings > Secrets and variables > Actions > Variables
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::234360896960:role/GitHubActions-LuxuryResidence-Deploy
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://elcerroresidence-web-234360896960-us-east-1-an --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E4S2KW1E7JQAH \
            --paths "/*"